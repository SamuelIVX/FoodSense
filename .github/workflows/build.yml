name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test (Linux Headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run mvn -Djavacpp.platform.host --batch-mode clean verify

      - name: Build and Test (Mac/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: mvn -Djavacpp.platform.host --batch-mode clean verify

      - name: Upload PR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodSense-${{ runner.os }}-${{ runner.arch }}
          path: target/FoodSense.jar
