name: Release
on:
  release:
    types: [published]

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Fat JAR
        shell: bash
        run: mvn -Djavacpp.platform.host --batch-mode clean package -DskipTests

      - name: Print Output Size
        shell: bash
        run: ls -lh target/FoodSense.jar

      - name: Rename OS/Arch-specific Artifact
        shell: bash
        run: mv target/FoodSense.jar target/FoodSense-${{ runner.os }}-${{ runner.arch }}.jar

      - name: Upload Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/FoodSense-${{ runner.os }}-${{ runner.arch }}.jar
