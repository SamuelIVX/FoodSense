name: Release
on:
  release:
    types: [published]

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Fat JAR (Linux Headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run mvn -Djavacpp.platform.host --batch-mode clean package

      - name: Build Fat JAR (Mac/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: mvn -Djavacpp.platform.host --batch-mode clean package

      - name: Rename OS/Arch-specific Artifact
        shell: bash
        run: mv target/FoodSense.jar target/FoodSense-${{ runner.os }}-${{ runner.arch }}.jar

      - name: Generate SHA-256 Checksum
        shell: bash
        run: |
          cd target
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum FoodSense-${{ runner.os }}-${{ runner.arch }}.jar > FoodSense-${{ runner.os }}-${{ runner.arch }}.jar.sha256
          else
            shasum -a 256 FoodSense-${{ runner.os }}-${{ runner.arch }}.jar > FoodSense-${{ runner.os }}-${{ runner.arch }}.jar.sha256
          fi

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/FoodSense-${{ runner.os }}-${{ runner.arch }}.jar

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/FoodSense-${{ runner.os }}-${{ runner.arch }}.jar
            target/FoodSense-${{ runner.os }}-${{ runner.arch }}.jar.sha256
